name: Secret scan (gitleaks)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  gitleaks-scan:
    name: Scan repository for secrets with gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (detect secrets)
        uses: zricethezav/gitleaks-action@v8
        with:
          args: detect --source=. --report-path=gitleaks_report.json --report-format=json

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks_report.json
